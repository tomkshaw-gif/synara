name: Sync upstream

on:
  schedule:
    # Daily at 05:23 UTC.
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream/main
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      UPSTREAM_REPO: https://github.com/Emanuele-web04/synara.git
      SYNC_BRANCH: sync/upstream
      # SYNC_PAT authenticates both checkout/push and gh so sync CI can run
      # automatically. GITHUB_TOKEN suppresses push-triggered runs; token-created
      # PR runs may require manual approval.
      GH_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPO" || git remote set-url upstream "$UPSTREAM_REPO"
          # Upstream release tags share our vX.Y.Z numbering; never pull them.
          git fetch --no-tags upstream main

      - name: Check for new upstream commits
        id: status
        run: |
          behind="$(git rev-list --count HEAD..upstream/main)"
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "main is $behind commit(s) behind upstream/main."

      - name: Setup Bun
        if: steps.status.outputs.behind != '0'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Build sync branch
        if: steps.status.outputs.behind != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH" HEAD

          if git merge upstream/main -m "merge: upstream/main"; then
            echo "Clean merge."
            exit 0
          fi

          # Resolve only a stable version-field conflict in the merged text.
          # Other manifest conflicts stop for manual review; never select a whole file.
          bun scripts/resolve-upstream-version-conflicts.ts

          if git diff --name-only --diff-filter=U | grep -Fxq "bun.lock"; then
            git checkout --theirs bun.lock
          fi
          # Manifest resolution may change the version even if bun.lock merged cleanly.
          bun install --lockfile-only --ignore-scripts
          git add bun.lock

          git commit --no-edit
          echo "Merged with auto-resolved version files."

      - name: Push sync branch
        if: steps.status.outputs.behind != '0'
        run: git push origin "$SYNC_BRANCH" --force-with-lease

      - name: Create or update pull request
        if: steps.status.outputs.behind != '0'
        shell: bash
        run: |
          set -euo pipefail
          behind="${{ steps.status.outputs.behind }}"
          upstream_head="$(git rev-parse --short upstream/main)"
          body=$'Automated merge of `upstream/main` (Emanuele-web04/synara) into `main`.\n\n**Merge this PR with a merge commit — do NOT squash.** Squashing drops the merge base, so the next upstream sync re-evaluates every diverged commit and produces repeated conflicts.\n\nOnly stable version-field conflicts were auto-resolved; other merged manifest fields were preserved; `bun.lock` was regenerated to match.'

          existing="$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number')"
          if [[ -n "$existing" ]]; then
            gh pr comment "$existing" --body "Updated with upstream/main @ ${upstream_head} (${behind} commits ahead of main)."
            echo "Updated existing PR #$existing."
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$SYNC_BRANCH" \
            --title "chore: sync upstream/main (${upstream_head})" \
            --body "$body"
